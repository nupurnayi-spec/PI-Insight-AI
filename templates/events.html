{% extends "base.html" %}{% block title %}Event Intelligence{% endblock %}{% block content %}<section class="card"><h3>Event Frames-style Incidents</h3><table><tr><th>Asset</th><th>Event</th><th>Severity</th><th>Time</th><th>Message</th><th>Status</th></tr>{% for e in events %}<tr><td>{{e.asset}}</td><td>{{e.event_type}}</td><td><span class="badge">{{e.severity}}</span></td><td>{{e.start_time}}</td><td>{{e.message}}</td><td>{{e.status}}</td></tr>{% endfor %}</table></section>{% endblock %}
