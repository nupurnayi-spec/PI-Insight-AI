{% extends "base.html" %}{% block title %}Asset Framework{% endblock %}{% block content %}<section class="card"><h3>AF-style Asset Hierarchy</h3><table><tr><th>Element</th><th>Type</th><th>Health</th><th>Risk</th><th>Status</th></tr>{% for a in assets %}<tr><td><b>{{a.asset}}</b></td><td>{{a.type}}</td><td>{{a.health}}%</td><td><span class="badge {{a.risk|lower}}">{{a.risk}}</span></td><td>{{a.status}}</td></tr>{% endfor %}</table></section>{% endblock %}
